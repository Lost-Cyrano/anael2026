<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a1a;
            font-family: sans-serif;
        }

        .container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100vh;
            height: 100dvh;
        }

        .toolbar {
            display: flex;
            justify-content: flex-end;
            padding: 8px 12px;
            background: #1a1a1a;
            flex-shrink: 0;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            text-decoration: none;
            transition: background 0.2s ease, transform 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .download-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: scale(1.05);
        }

        .download-btn:active {
            transform: scale(0.95);
        }

        .download-btn svg {
            width: 20px;
            height: 20px;
        }

        .viewer {
            flex: 1;
            width: 100%;
            border: none;
            background: #2a2a2a;
        }

        /* Fallback mobile : si l'iframe PDF ne fonctionne pas, on affiche un lien */
        @media (max-width: 768px) {
            .viewer {
                min-height: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="toolbar">
            <a class="download-btn"
               href="../Profession de fois Anael et Jade CVL2027.pdf"
               download
               aria-label="Télécharger le PDF">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
            </a>
        </div>
        <iframe
            class="viewer"
            src="../Profession de fois Anael et Jade CVL2027.pdf#toolbar=0&navpanes=0&scrollbar=1&view=FitH"
            title="PDF">
        </iframe>
    </div>
</body>
</html>
