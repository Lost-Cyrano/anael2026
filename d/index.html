<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a1a;
            font-family: sans-serif;
        }

        .container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100vh;
            height: 100dvh;
        }

        .toolbar {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding: 8px 12px;
            background: #1a1a1a;
            flex-shrink: 0;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            text-decoration: none;
            transition: background 0.2s ease, transform 0.2s ease;
            -webkit-tap-highlight-color: transparent;
            position: relative;
        }

        .download-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: scale(1.05);
        }

        .download-btn:active {
            transform: scale(0.95);
        }

        .download-btn svg {
            width: 20px;
            height: 20px;
        }

        .download-btn .badge {
            position: absolute;
            top: -2px;
            right: -2px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #fff;
            color: #1a1a1a;
            font-size: 9px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .viewers {
            flex: 1;
            display: flex;
            flex-direction: row;
            width: 100%;
            min-height: 0;
        }

        .viewer {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
            background: #2a2a2a;
        }

        .viewer + .viewer {
            border-left: 1px solid #333;
        }

        /* Mobile : empilement vertical */
        @media (max-width: 768px) {
            .viewers {
                flex-direction: column;
            }

            .viewer + .viewer {
                border-left: none;
                border-top: 1px solid #333;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="toolbar">
            <a class="download-btn"
               href="../Profession de fois Anael et Jade CVL2027.pdf"
               download
               aria-label="Télécharger le premier PDF">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                <span class="badge">1</span>
            </a>
            <a class="download-btn"
               href="../Acte De Candidature.pdf"
               download
               aria-label="Télécharger le second PDF">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                <span class="badge">2</span>
            </a>
        </div>
        <div class="viewers">
            <iframe
                class="viewer"
                src="../Profession de fois Anael et Jade CVL2027.pdf#toolbar=0&navpanes=0&scrollbar=1&view=FitH"
                title="PDF 1">
            </iframe>
            <iframe
                class="viewer"
                src="../Acte De Candidature.pdf#toolbar=0&navpanes=0&scrollbar=1&view=FitH"
                title="PDF 2">
            </iframe>
        </div>
    </div>
</body>
</html>
